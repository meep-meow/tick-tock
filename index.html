<!DOCTYPE html>
<html>
<head>
  <title>Study Timer</title>
  <link rel="stylesheet" href="style.css">
</head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Elms+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<body>
  
<!-- Tabs for each section -->
<div class="layout">

  <div class="sidebar">
    <button onclick="showSection('stopwatch')">Stopwatch</button>
    <button onclick="showSection('pomodoro')">Pomodoro</button>
    <button onclick="showSection('stats')">Stats</button>
    <button onclick="showSection('customize')">Customize</button>
  </div>

  <div class="main">
    <!-- ALL your sections go here -->
    <!-- Stopwatch -->
<section id="stopwatch" class="page">
  <h2>Stopwatch</h2>
  <h3 id="stopwatchDisplay">00:00:00</h3>
  <button class="text-button" onclick="startStopwatch()">
    Start
  </button>
  <button class="text-button" onclick="pauseStopwatch()">
    Pause
  </button>
  <button class="text-button" onclick="resetStopwatch()">
    Reset
  </button>
  <button class="text-button" onclick="logStopwatchSession()">
    Log Session
  </button>
</section>
<!-- Pomodoro -->
<section id="pomodoro" class="page hidden">
  <h2 id="pomodoroMode">Focus</h2>
  <h3 id="pomodoroDisplay">25:00</h3>
  <button class="text-button" onclick="startPomodoro()">
    Start
  </button>
  <button class="text-button" onclick="pausePomodoro()">
    Pause
  </button>
  <button class="text-button" onclick="resetPomodoro()">
    Reset
  </button>
  <div>
    <button class="text-button" onclick="setPomodoroMode('focus')">
      Focus
    </button>
    <button class="text-button" onclick="setPomodoroMode('shortBreak')">
      Short Break
    </button>
    <button class="text-button" onclick="setPomodoroMode('longBreak')">
      Long Break
    </button>
  </div>

</section>

<!-- Statistics -->
<section id="stats" class="page hidden">
  <h2>Statistics</h2>
  <p id="sessionCount">
    Sessions: 0
  </p>
  <p id="pomodoroCount">
    Pomodoro sessions: 0
  </p>
  <p id="todayTime">
    Today: 0 minutes
  </p>
  <p id="totalTime">
    Total time: 0 days, 0 hours, 0 minutes
  </p>
  <button class="text-button" onclick="resetStats()">
    Reset Stats
  </button>
  <div class="calendar-navigation">
    <button onclick="changeMonth(-1)">←</button>
    <span id="calendarTitle"></span>
    <button onclick="changeMonth(1)">→</button>
  </div>
  <div id="calendar"></div>

</section>

<!-- Customization -->
<section id="customize" class="page hidden">
  <h2>Customize</h2>

  <input type="file" id="backgroundUpload" accept="image/*">
  <button onclick="uploadBackground()">Set Background</button>
  <button onclick="clearBackground()">Clear Background</button>
</section>
    
    <section id="stopwatch" class="page">...</section>
    <section id="pomodoro" class="page hidden">...</section>
    <section id="stats" class="page hidden">...</section>
    <section id="customize" class="page hidden">...</section>

  </div>

<script src="script.js"></script>
</body>
</html>
